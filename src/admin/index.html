<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Gateway QRIS</title>
  <link rel="stylesheet" href="/admin/style.css" />
</head>
<body>
  <header class="topbar">
    <span class="brand">Gateway QRIS</span>
    <span id="user-label" class="muted"></span>
    <button id="logout" class="btn-ghost">Keluar</button>
  </header>

  <main class="container">
    <div id="view-admin" class="hidden">
      <h2>Kelola Merchant</h2>
      <button id="btn-new-merchant" class="btn">+ Buat Merchant</button>
      <div id="merchant-form-wrap" class="hidden card">
        <h3>Buat Merchant Baru</h3>
        <form id="merchant-form">
          <label>Nama merchant</label>
          <input name="name" required />
          <label>QRIS statis</label>
          <textarea name="qris_static" rows="2" required></textarea>
          <label>Webhook URL</label>
          <input name="webhook_url" type="url" required />
          <label>Webhook secret (kosongkan = generate otomatis)</label>
          <input name="webhook_secret" />
          <label>Username login dashboard (opsional)</label>
          <input name="username" />
          <label>Password login dashboard (opsional, min 8 karakter)</label>
          <input name="password" type="password" />
          <div class="row">
            <button type="submit" class="btn">Simpan</button>
            <button type="button" id="btn-cancel-merchant" class="btn-ghost">Batal</button>
          </div>
        </form>
      </div>
      <div id="merchant-list"></div>

      <h2>Transaksi</h2>
      <div class="filters">
        <select id="filter-merchant"><option value="">Semua merchant</option></select>
        <select id="filter-status">
          <option value="">Semua status</option>
          <option value="pending">pending</option>
          <option value="paid">paid</option>
          <option value="expired">expired</option>
          <option value="refunded">refunded</option>
          <option value="failed">failed</option>
        </select>
        <button id="btn-refresh-txn" class="btn">Muat</button>
      </div>
      <div id="txn-table"></div>

      <h2>Orphan Payments</h2>
      <button id="btn-refresh-orphans" class="btn">Muat</button>
      <div id="orphan-table"></div>
    </div>

    <div id="view-merchant" class="hidden">
      <h2>Konfigurasi Merchant</h2>
      <div id="merchant-info" class="card"></div>

      <h2>Transaksi Saya</h2>
      <div class="filters">
        <select id="m-filter-status">
          <option value="">Semua status</option>
          <option value="pending">pending</option>
          <option value="paid">paid</option>
          <option value="expired">expired</option>
          <option value="refunded">refunded</option>
        </select>
        <button id="m-btn-refresh-txn" class="btn">Muat</button>
      </div>
      <div id="m-txn-table"></div>

      <h2>Orphan Payments Saya</h2>
      <button id="m-btn-refresh-orphans" class="btn">Muat</button>
      <div id="m-orphan-table"></div>
    </div>
  </main>

  <script src="/admin/app.js"></script>
</body>
</html>
